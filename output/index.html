<html lang="en">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(30, 41, 59, 0.65);
      --card-border: rgba(255, 255, 255, 0.06);
      --accent-project: #f59e0b;
      --accent-it: #38bdf8;
      --accent-rental: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    /* Map full container */
    #map {
      flex: 1;
      height: 100%;
      background: #0b1120;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Sidebar overlay */
    .sidebar {
      position: absolute;
      top: 16px;
      left: 16px;
      bottom: 16px;
      width: 440px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header {
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .brand-tag .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      line-height: 1.4;
    }

    /* KPI Summary Stats Bar */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 14px 24px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--panel-border);
    }

    .kpi-box {
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .kpi-val {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .kpi-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    /* Filter pills */
    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 12px 24px 8px;
    }

    .filter-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .filter-btn.active.filter-it {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
    }

    .filter-btn.active.filter-rental {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    /* Project switcher pills */
    .project-selector {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .project-pill {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .project-pill.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    /* Locations List */
    .location-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .loc-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .loc-card:hover {
      background: rgba(51, 65, 85, 0.7);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.4);
    }

    .loc-card.selected {
      border-color: #38bdf8;
      background: rgba(30, 58, 102, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .loc-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .loc-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .loc-type-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-rental {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .badge-it {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .loc-details {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .detail-item strong {
      color: #f1f5f9;
      font-weight: 600;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      font-family: 'JetBrains Mono', monospace;
    }

    .loc-footer {
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-dim);
    }

    .code-badge {
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Floating Legend */
    .map-legend {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px 18px;
      z-index: 1000;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      font-size: 12px;
    }

    .legend-title {
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 11.5px;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .circle-project {
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      border: 2px solid #fff;
    }

    .circle-rental {
      border: 2px solid #10b981;
      background: rgba(16, 185, 129, 0.25);
    }

    .circle-it {
      border: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.25);
    }

    /* Custom Leaflet Tooltip & Popup styles */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.96) !important;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      color: #fff !important;
      padding: 6px !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7) !important;
    }
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    .leaflet-popup-content {
      margin: 10px 14px !important;
      line-height: 1.4 !important;
    }
    .popup-title {
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
    }
    .popup-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .popup-stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #38bdf8;
      margin-top: 4px;
    }

    /* Pulse animation for project marker */
    .radar-pulse {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.4);
      border: 2px solid #f59e0b;
      box-shadow: 0 0 16px #f59e0b;
      position: relative;
    }
    .radar-pulse::after {
      content: '';
      position: absolute;
      top: -12px;
      left: -12px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.6);
      animation: pulse 2s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
  </style>
</head>

          <div style="position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #f59e0b;"></div>

    const legendTitle = document.getElementById('legend-title-text');
    const legendTargetLabel = document.getElementById('legend-target-label');

    function switchProject(key) {
      currentProjectKey = key;
      document.getElementById('pill-vision_flora').classList.toggle('active', key === 'vision_flora');
      document.getElementById('pill-aurelia').classList.toggle('active', key === 'aurelia');

      document.getElementById('legend-project-name').innerHTML = `<strong>${pData.name}</strong> (Project Point)`;

      // Clear existing layers
      if (projectMarker) map.removeLayer(projectMarker);
      mapLayers.forEach(l => {
        map.removeLayer(l.circle);
        map.removeLayer(l.marker);
        map.removeLayer(l.line);
      });
      mapLayers = [];

      // Add project pin
      projectMarker = L.marker([pData.lat, pData.lng], { icon: projectIcon }).addTo(map);
      projectMarker.bindPopup(`
        <div class="popup-title">⭐ ${pData.name}</div>
        <div class="popup-meta">${pData.address}</div>
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; margin-top: 4px;">
          <div class="popup-stat">2BHK EMI: ₹${pData.emi_2bhk.toLocaleString('en-IN')}/mo</div>
          <div class="popup-stat">3BHK EMI: ₹${pData.emi_3bhk.toLocaleString('en-IN')}/mo</div>
        </div>
      `);

      // Add target circles
      pData.targets.forEach(t => {
        const radiusMeters = t.radius_km * 1000;
        const circle = L.circle([t.lat, t.lng], {
          radius: radiusMeters,
          color: '#38bdf8',
          weight: 2,
          opacity: 0.9,
          fillColor: '#38bdf8',
          fillOpacity: 0.16,
          dashArray: '6, 6'
        }).addTo(map);

        const centerMarker = L.circleMarker([t.lat, t.lng], {
          radius: 6,
          color: '#ffffff',
          weight: 2,
          fillColor: '#38bdf8',
          fillOpacity: 1
        }).addTo(map);

        const connectorLine = L.polyline([
          [pData.lat, pData.lng],
          [t.lat, t.lng]
        ], {
          color: '#38bdf8',
          weight: 1.5,
          opacity: 0.45,
          dashArray: '4, 8'
        }).addTo(map);

        circle.bindPopup(`
          <div class="popup-title">${t.name}</div>
          <div class="popup-meta">Target Radius: <strong>${t.radius_km} km</strong></div>
          <div class="popup-stat">Commute: ${t.drive_minutes.toFixed(0)} min &bull; Score: ${t.score}</div>
          <div class="popup-stat">Ads Code: ${t.ads_code}</div>
        `);

        mapLayers.push({ target: t, circle, marker: centerMarker, line: connectorLine });
      });

      // Fit map to points
      const allCoords = [[pData.lat, pData.lng], ...pData.targets.map(t => [t.lat, t.lng])];
      map.fitBounds(L.latLngBounds(allCoords).pad(0.2));

      // Render mode
      setCampaignMode(currentMode);
    }

      document.getElementById('tab-c').classList.toggle('active', mode === 'C');

      if (mode === 'A') renderCampaignA();
      else if (mode === 'B') renderCampaignB();
      else if (mode === 'C') renderCautions();
    }
